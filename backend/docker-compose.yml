services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decisioncore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisioncore}
      POSTGRES_DB: ${POSTGRES_DB:-decisioncore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - decisioncore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-decisioncore} -d $${POSTGRES_DB:-decisioncore}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-decisioncore}:${POSTGRES_PASSWORD:-decisioncore}@db:5432/${POSTGRES_DB:-decisioncore}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  decisioncore_pgdata: